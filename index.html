<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InterviewXpert - AI Interview Platform ! </title>
  <meta name="description"
    content="InterviewXpert is an AI-powered platform designed to help you master your interview skills with real-time feedback and practice scenarios." />
  <link id="favicon" rel="icon" type="image/png" href="/logo-white.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Cloudinary Upload Widget -->
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script>
    // amazon-cognito-identity-js expects Node's `global`
    window.global = window.globalThis || window;
  </script>
  <script>
    // Immediately apply dark mode if preference exists to prevent FOUC (Flash of Unstyled Content)
    const storedTheme = localStorage.theme;
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (storedTheme === 'dark' || (storedTheme === 'system' && prefersDark) || (!storedTheme && prefersDark)) {
      document.documentElement.classList.add('dark')
    } else {
      document.documentElement.classList.remove('dark')
    }
  </script>
</head>

<body
  class="bg-background text-foreground font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">
  <div id="root"></div>
  <div id="portal-root"></div>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
